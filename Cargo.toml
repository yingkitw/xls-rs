[package]
name = "xls-rs"
version = "0.1.14"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/yingkitw/xls-rs"
readme = "README.md"
homepage = "https://github.com/yingkitw/xls-rs"
documentation = "https://docs.rs/xls-rs"
keywords = ["xlsx", "excel", "csv", "spreadsheet", "mcp"]
categories = [
    "command-line-utilities",
    "parser-implementations",
    "data-structures",
    "encoding",
    "api-bindings",
]
description = "Pure-Rust spreadsheet CLI, library, and MCP server for reading, writing, converting, and analyzing XLSX, XLS, CSV, ODS, Parquet, and Avro files. Native XLSX/XLS writers with charts, styles, conditional formatting, sparklines, structured tables, and formulas. Pandas-style data operations, LaTeX export, and password-protected XLSX decryption. No Microsoft Excel, Python, or JVM dependency."
exclude = [
    ".claude/**",
    ".windsurf/**",
    ".devin/**",
    "AGENTS.md",
    "MEMORY.md",
    "test_*.csv",
    "output/",
    "examples/*.xlsx",
    "examples/*.xls",
    "examples/*.parquet",
    "examples/*.avro",
    "examples/test_*.csv",
]

[package.metadata]
# SEO/GEO: keywords for discoverability across crates.io, docs.rs, and AI engines
# Primary: xlsx, excel, csv, spreadsheet, rust
# Secondary: parquet, avro, ods, mcp, cli, data-analysis, etl, convert

[package.metadata.docs.rs]
all-features = true

[lib]
name = "xls_rs"
path = "src/lib.rs"

[[bin]]
name = "xls-rs"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.14", features = ["server", "transport-io", "macros"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
zip = "2.2"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
regex = "1.10"
parquet = { version = "54", features = ["arrow"], optional = true }
arrow-array = { version = "54", optional = true }
arrow-schema = { version = "54", optional = true }
apache-avro = { version = "0.17", optional = true }
toml = "0.8"
dirs = "5.0"
glob = "0.3"
rayon = "1.10"
ureq = { version = "2.12", optional = true }
clap = { version = "4.5", features = ["derive"] }
clap_complete = { version = "4.5", optional = true }
notify = { version = "6", optional = true }
ctrlc = { version = "3", optional = true }
tempfile = "3.12"
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["alloc"], optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
pbkdf2 = { version = "0.12", optional = true }

[features]
default = ["watch", "completions", "mcp", "parquet", "avro", "gsheets"]
watch = ["dep:notify", "dep:ctrlc"]
completions = ["dep:clap_complete"]
mcp = ["dep:rmcp"]
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]
avro = ["dep:apache-avro"]
gsheets = ["dep:ureq"]
password = ["dep:aes", "dep:cbc", "dep:sha2", "dep:hmac", "dep:pbkdf2"]

# Smaller `target/` and fewer incremental rename failures when the disk is almost full.
[profile.dev]
incremental = false

[profile.test]
incremental = false

[dev-dependencies]

[[test]]
name = "test_columnar"
required-features = ["parquet", "avro"]

[[test]]
name = "test_converter"
required-features = ["parquet", "avro"]

[[test]]
name = "test_traits"
required-features = ["parquet", "avro"]

[[test]]
name = "test_google_sheets"
required-features = ["gsheets"]

[[test]]
name = "generate_examples"
required-features = ["parquet", "avro"]

[[test]]
name = "test_handler_registry"
required-features = ["parquet", "avro"]

[[test]]
name = "test_password"
required-features = ["password"]
