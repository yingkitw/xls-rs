[package]
name = "xls-rs"
version = "0.1.9"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/yingkitw/xls-rs"
readme = "README.md"
homepage = "https://github.com/yingkitw/xls-rs"
documentation = "https://docs.rs/xls-rs"
keywords = ["excel", "csv", "parquet", "spreadsheet", "mcp-server"]
categories = [
    "command-line-utilities",
    "parser-implementations",
    "data-structures",
    "encoding",
    "api-bindings",
]
description = "Rust spreadsheet CLI, library, and MCP server for reading, writing, converting, and analyzing XLSX, XLS, CSV, ODS, Parquet, and Avro with pandas-style operations."
exclude = [
    ".claude/**",
    "AGENTS.md",
    "test_*.csv",
    "examples/*.xlsx",
    "examples/*.parquet",
    "examples/*.avro",
    "examples/test_*.csv",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "xls_rs"
path = "src/lib.rs"

[[bin]]
name = "xls-rs"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.14", features = ["server", "transport-io", "macros"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
zip = "2.2"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
regex = "1.10"
parquet = { version = "54", features = ["arrow"], optional = true }
arrow-array = { version = "54", optional = true }
arrow-schema = { version = "54", optional = true }
apache-avro = { version = "0.17", optional = true }
toml = "0.8"
dirs = "5.0"
glob = "0.3"
rayon = "1.10"
ureq = { version = "2.12", optional = true }
clap = { version = "4.5", features = ["derive"] }
clap_complete = { version = "4.5", optional = true }
notify = { version = "6", optional = true }
ctrlc = { version = "3", optional = true }

[features]
default = ["watch", "completions", "mcp", "parquet", "avro", "gsheets"]
watch = ["dep:notify", "dep:ctrlc"]
completions = ["dep:clap_complete"]
mcp = ["dep:rmcp"]
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]
avro = ["dep:apache-avro"]
gsheets = ["dep:ureq", "tokio"]

# Smaller `target/` and fewer incremental rename failures when the disk is almost full.
[profile.dev]
incremental = false

[profile.test]
incremental = false

[dev-dependencies]
tempfile = "3.12"

[[test]]
name = "test_columnar"
required-features = ["parquet", "avro"]

[[test]]
name = "test_converter"
required-features = ["parquet", "avro"]

[[test]]
name = "test_traits"
required-features = ["parquet", "avro"]

[[test]]
name = "test_google_sheets"
required-features = ["gsheets"]

[[test]]
name = "generate_examples"
required-features = ["parquet", "avro"]

[[test]]
name = "test_handler_registry"
required-features = ["parquet", "avro"]
