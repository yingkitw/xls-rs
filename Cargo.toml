[package]
name = "xls-rs"
version = "0.1.15"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/yingkitw/xls-rs"
readme = "README.md"
homepage = "https://github.com/yingkitw/xls-rs"
documentation = "https://docs.rs/xls-rs"
keywords = ["xlsx", "excel", "spreadsheet", "rust"]
categories = [
    "command-line-utilities",
    "parser-implementations",
    "data-structures",
    "encoding",
]
description = "The pure-Rust XLSX toolkit. Read, write, and manipulate Excel XLSX files from CLI or library. Native XLSX writer with charts, styles, conditional formatting, and formulas. No Microsoft Excel, Python, or JVM dependency."


[package.metadata]
# Primary: xlsx, excel, spreadsheet, rust

[package.metadata.docs.rs]
all-features = true

[lib]
name = "xls_rs"
path = "src/lib.rs"

[[bin]]
name = "xls-rs"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
zip = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
regex = "1.10"
toml = "0.8"
dirs = "5.0"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.12"

[features]
default = []

# Smaller `target/` and fewer incremental rename failures when the disk is almost full.
[profile.dev]
incremental = false

[profile.test]
incremental = false

[dev-dependencies]
